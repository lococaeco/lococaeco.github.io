name: Blog checks

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blog-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Build public site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --trace
      - name: Check generated pages, search and sitemap
        run: python3 scripts/check_site.py --site _site
