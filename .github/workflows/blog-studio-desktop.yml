name: Blog Studio desktop builds

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/blog-studio/**'
      - '.github/workflows/blog-studio-desktop.yml'
  pull_request:
    paths:
      - 'tools/blog-studio/**'
      - '.github/workflows/blog-studio-desktop.yml'

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

concurrency:
  group: blog-studio-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: ubuntu-x86_64
            executable: BlogStudio-linux-x86_64
          - os: windows-2022
            name: windows-x86_64
            executable: BlogStudio.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 'tools/blog-studio/requirements*.txt'
      - name: Install packaging dependencies
        run: python -m pip install -r tools/blog-studio/requirements-build.txt
      - name: Test editor and desktop lifecycle
        run: python -m unittest discover -s tools/blog-studio/tests -p "test_*.py"
      - name: Build standalone application
        run: python tools/blog-studio/build_desktop.py
      - name: Test packaged application on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a python tools/blog-studio/tests/package_smoke.py tools/blog-studio/dist/${{ matrix.executable }}
      - name: Test packaged application on Windows
        if: runner.os == 'Windows'
        run: python tools/blog-studio/tests/package_smoke.py tools/blog-studio/dist/${{ matrix.executable }}
      - uses: actions/upload-artifact@v4
        with:
          name: BlogStudio-${{ matrix.name }}
          path: tools/blog-studio/dist/*
          if-no-files-found: error
          retention-days: 30
