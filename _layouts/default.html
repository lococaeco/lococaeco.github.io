<!doctype html>
<html lang="{{ site.locale | default: 'ko-KR' | escape }}">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        {% include seo.html %}
        <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css" integrity="sha512-MV7K8+y+gLIBoVD59lQIYicR65iaqukzvf/nwasF0nqhPay5w/9lJmVM2hMDcnK1OnMGCdVK+iQrJ7lzPJQd1w==" crossorigin="anonymous" referrerpolicy="no-referrer">
        {% if page.url == '/about' %}
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Charm&amp;display=swap" rel="stylesheet">
        {% endif %}

        {% if page.layout == 'post' and page.mathjax != false %}
        <script>
            window.MathJax = {
                tex: {inlineMath: [['$', '$'], ['\\(', '\\)']]},
                options: {skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']}
            };
        </script>
        <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js"></script>
        {% endif %}

        <link rel="shortcut icon" href="{{ '/assets/images/favicon_io/favicon.ico' | relative_url }}">
        <link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/images/favicon_io/apple-touch-icon.png' | relative_url }}">
        <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/images/favicon_io/favicon-32x32.png' | relative_url }}">
        <link rel="icon" type="image/png" sizes="16x16" href="{{ '/assets/images/favicon_io/favicon-16x16.png' | relative_url }}">
        <link rel="manifest" href="{{ '/assets/images/favicon_io/site.webmanifest' | relative_url }}">
        <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
    </head>
    <body>
        <a class="skip-link" href="#main-content">본문으로 바로가기</a>
        {% include topbar.html %}
        {% include sidebar.html %}
        <main id="main-content" tabindex="-1">
            {{ content }}
        </main>
        {% include footer.html %}
        <a href="#main-content" class="scroll-btn go-top" aria-label="페이지 맨 위로" title="페이지 맨 위로">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 19V5m-7 7 7-7 7 7"/></svg>
        </a>
        <a href="#footer" class="scroll-btn go-bottom" aria-label="페이지 맨 아래로" title="페이지 맨 아래로">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 5v14m-7-7 7 7 7-7"/></svg>
        </a>

        {% if site.ads_enabled %}
        <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1356766942667137" crossorigin="anonymous"></script>
        <ins class="adsbygoogle" style="display:block;min-height:100px" data-ad-client="ca-pub-1356766942667137" data-ad-slot="1461228811" data-ad-format="auto" data-full-width-responsive="true"></ins>
        <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
        {% endif %}
    </body>
</html>
