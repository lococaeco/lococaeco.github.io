<!doctype html>
<html lang="ko">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | truncatewords: 30 }}">
        <meta name="author" content="lococaeco">

        {% if page.title %}
            <title>{{ page.title }} | lococaeco</title>
        {% else %}
            <title>lococaeco</title>
        {% endif %}

        <!-- Open Graph -->
        <meta property="og:title" content="{{ page.title | default: site.title }}">
        <meta property="og:description" content="{{ page.excerpt | default: site.description | strip_html | truncatewords: 30 }}">
        <meta property="og:type" content="website">
        <meta property="og:url" content="{{ page.url | absolute_url }}">

        <!-- custom css -->
        <link 
            rel="stylesheet" 
            href="{{ '/assets/css/style.css' | relative_url }}"
        />

        <!-- icon -->
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
        <script src='https://kit.fontawesome.com/a076d05399.js' crossorigin='anonymous'></script>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css" integrity="sha512-MV7K8+y+gLIBoVD59lQIYicR65iaqukzvf/nwasF0nqhPay5w/9lJmVM2hMDcnK1OnMGCdVK+iQrJ7lzPJQd1w==" crossorigin="anonymous" referrerpolicy="no-referrer" />

        <!-- font -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Charm&display=swap" rel="stylesheet">

        <!-- highlight style -->
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/styles/github-dark.min.css"
        />
        <script src="//cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/highlight.min.js"></script>
        <script>
            hljs.highlightAll();
        </script>

        <!-- mathjax -->
        <script>
            MathJax = {
              tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']]
              }
            };
        </script>
        <script id="MathJax-script" async
            src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
        </script>

        <!-- favicon -->
        <link rel="shortcut icon" href="/assets/images/favicon_io/favicon.ico">
        <link rel="apple-touch-icon" sizes="180x180" href="/assets/images/favicon_io/apple-touch-icon.png">
        <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/favicon_io/favicon-32x32.png">
        <link rel="icon" type="image/png" sizes="16x16" href="/assets/images/favicon_io/favicon-16x16.png">
        <link rel="manifest" href="/assets/images/favicon_io/site.webmanifest">
    </head>    
    
    <!-- actual page -->
    <body>
        {% include topbar.html %}

        <!-- side bar -->
        {% include sidebar.html %}

        <!-- body main -->
        {{ content }}
        
        <!-- footer -->
        {% include footer.html %}

        <!-- go to the top -->
        <a href="#" class="scroll-btn go-top" title="Top">
            <span class="material-symbols-outlined">
                arrow_upward
            </span>
        </a>

        
        <!-- go to the footer -->
        <a href="#footer" class="scroll-btn go-bottom" title="Bottom">
            <span class="material-symbols-outlined">
                arrow_downward
            </span>
        </a>

        <!-- main script -->
        <script src="/assets/js/main.js"></script>

        <!-- Loading -->
        <style type="text/css">
            #load {
                width: 100%;
                height: 100%;
                top: 0;
                left: 0;
                position: fixed;
                display: block;
                opacity: 0.9;
                background: white;
                z-index: 99;
                text-align: center;
            }

            #load > img {
                width: 3vh;
                height: 3vh;
                z-index: 100;
                position: absolute;
                top: 50%;
                left: 50%;
            }
        </style>

        <div id="load">
            <img src="/assets/images/loading.gif" alt="loading">
        </div>

        <!-- blog ad -->
        <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1356766942667137"
            crossorigin="anonymous"></script>
        <!-- 기본 -->
        <ins class="adsbygoogle"
            style="display:block"
            data-ad-client="ca-pub-1356766942667137"
            data-ad-slot="1461228811"
            data-ad-format="auto"
            data-full-width-responsive="true"></ins>
        <script>
            (adsbygoogle = window.adsbygoogle || []).push({});
        </script>
    </body>
</html>
