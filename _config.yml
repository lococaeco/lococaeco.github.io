# basic info
locale : "ko-KR"
title : "lococaeco"
name : "lococaeco"
description : "LLM & Reinforcement Learning 연구 블로그"
url : "https://lococaeco.github.io"
repository : "https://github.com/lococaeco/lococaeco.github.io"
timezone: Asia/Seoul
ads_enabled: true

# Serve a compact stylesheet; canonical URLs remain unchanged.
sass:
  style: compressed


# Reading Files
include:
  - .htaccess
  - _pages
exclude:
  - tools
  - .blog-studio
  - blog-studio.sh
  - blog-studio.cmd
  - "*.sublime-project"
  - "*.sublime-workspace"
  - vendor
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/plugins
  - assets/js/_main.js
  - assets/js/vendor
  - Capfile
  - CHANGELOG
  - config
  - Gemfile
  - Gemfile.lock
  - minimal-mistakes-jekyll.gemspec
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - log
  - node_modules
  - package.json
  - package-lock.json
  - Rakefile
  - README
  - README.md
  - scripts
  - assets/notion
  - npm-cache
  - tmp
  - /docs
  - /test
  - "**/*.bak"
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"


# Plugins
plugins:
  - jekyll-sitemap


# Permalink
permalink: /:categories/:title/


# Conversion
markdown: kramdown
highlighter: rouge


# Markdown Processing
kramdown:
  input: GFM
  math_engine: mathjax

defaults:
  # Global defaults
  -
    scope:
      path: ""
    values:
      layout: "post"
      mathjax: true
      toc: false
      comments: true

  # === AI ===
  -
    scope:
      path: "_pages/categories/category_ai.html"
    values:
      title_bg: "/assets/images/teaser/teaser-ai-machine_learning.webp"

  # AI / LLM
  -
    scope:
      path: "_posts/ai/llm/*"
    values:
      teaser: "/assets/images/teaser/teaser-ai-machine_learning.webp"
  -
    scope:
      path: "_pages/categories/category_ai_llm.html"
    values:
      title_bg: "/assets/images/teaser/teaser-ai-machine_learning.webp"

  # AI / Reinforcement Learning
  -
    scope:
      path: "_posts/ai/reinforcement_learning/*"
    values:
      teaser: "/assets/images/teaser/teaser-ai-reinforcement_learning.webp"
  -
    scope:
      path: "_pages/categories/category_ai_reinforcementlearning.html"
    values:
      title_bg: "/assets/images/teaser/teaser-ai-reinforcement_learning.webp"

  # AI / Deep Learning
  -
    scope:
      path: "_posts/ai/deep_learning/*"
    values:
      teaser: "/assets/images/teaser/teaser-ai-machine_learning.webp"
  -
    scope:
      path: "_pages/categories/category_ai_deeplearning.html"
    values:
      title_bg: "/assets/images/teaser/teaser-ai-machine_learning.webp"

  # AI / Paper Review
  -
    scope:
      path: "_posts/ai/paper_review/*"
    values:
      teaser: "/assets/images/teaser/teaser-ai-machine_learning.webp"
  -
    scope:
      path: "_pages/categories/category_ai_paperreview.html"
    values:
      title_bg: "/assets/images/teaser/teaser-ai-machine_learning.webp"

  # === Dev ===
  -
    scope:
      path: "_pages/categories/category_dev.html"
    values:
      title_bg: "/assets/images/teaser/teaser-dev-git.webp"

  # Dev / Python
  -
    scope:
      path: "_posts/dev/python/*"
    values:
      teaser: "/assets/images/teaser/teaser-programming-python.webp"
  -
    scope:
      path: "_pages/categories/category_dev_python.html"
    values:
      title_bg: "/assets/images/teaser/teaser-programming-python.webp"

  # Dev / Git
  -
    scope:
      path: "_posts/dev/git/*"
    values:
      teaser: "/assets/images/teaser/teaser-dev-git.webp"
  -
    scope:
      path: "_pages/categories/category_dev_git.html"
    values:
      title_bg: "/assets/images/teaser/teaser-dev-git.webp"

  # Dev / Markdown
  -
    scope:
      path: "_posts/dev/markdown/*"
    values:
      teaser: "/assets/images/teaser/teaser-programming-others.webp"
  -
    scope:
      path: "_pages/categories/category_dev_markdown.html"
    values:
      title_bg: "/assets/images/teaser/teaser-programming-others.webp"

  # Dev / Docker
  -
    scope:
      path: "_posts/dev/docker/*"
    values:
      teaser: "/assets/images/teaser/teaser-dev-docker.webp"
  -
    scope:
      path: "_pages/categories/category_dev_docker.html"
    values:
