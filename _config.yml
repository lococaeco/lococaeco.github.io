  # === Math ===
  -
    scope:
      path: "_pages/categories/category_math.html"
    values:
      title_bg: "/assets/images/teaser/teaser-math-linear_algebra.webp"

  # Math / Linear Algebra
  -
    scope:
      path: "_posts/math/linear_algebra/*"
    values:
      teaser: "/assets/images/teaser/teaser-math-linear_algebra.webp"
  -
    scope:
      path: "_pages/categories/category_math_linearalgebra.html"
    values:
      title_bg: "/assets/images/teaser/teaser-math-linear_algebra.webp"

  # Math / Probability & Statistics
  -
    scope:
      path: "_posts/math/probability_statistics/*"
    values:
      teaser: "/assets/images/teaser/teaser-math-math_for_ml.webp"
  -
    scope:
      path: "_pages/categories/category_math_probabilitystatistics.html"
    values:
      title_bg: "/assets/images/teaser/teaser-math-math_for_ml.webp"

  # This article is about isolated containers, so give it the Docker cover.
  -
    scope:
      path: "_posts/ai/llm/2026-03-01-openclaw-setting.md"
    values:
      teaser: "/assets/images/teaser/teaser-dev-docker.webp"
