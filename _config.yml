# basic info
locale : "ko-KR"
title : "lococaeco"
name : "lococaeco"
description : "LLM & Reinforcement Learning 연구 블로그"
url : "https://lococaeco.github.io"
repository : "https://github.com/lococaeco/lococaeco.github.io"
timezone: Asia/Seoul


# Reading Files
include:
  - .htaccess
  - _pages
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - vendor
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/plugins
  - assets/js/_main.js
  - assets/js/vendor
  - Capfile
  - CHANGELOG
  - config
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - log
  - node_modules
  - package.json
  - package-lock.json
  - Rakefile
  - README
  - tmp
  - /docs
  - /test
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"


# Conversion
markdown: kramdown
highlighter: rouge


# Markdown Processing
kramdown:
  input: GFM
  math_engine: mathjax

defaults:
  # Global defaults
  -
    scope:
      path: ""
    values:
      layout: "post"
      mathjax: true
      toc: false
      comments: true

  # === AI ===
  -
    scope:
      path: "_pages/categories/category_ai.html"
    values:
      title_bg: "/assets/images/lv2_bg/bg-ai-machine_learning.png"

  # AI / LLM
  -
    scope:
      path: "_posts/ai/llm/*"
    values:
      teaser: "/assets/images/teaser/teaser-ai-machine_learning.png"
  -
    scope:
      path: "_pages/categories/category_ai_llm.html"
    values:
      title_bg: "/assets/images/lv2_bg/bg-ai-machine_learning.png"

  # AI / Reinforcement Learning
  -
    scope:
      path: "_posts/ai/reinforcement_learning/*"
    values:
      teaser: "/assets/images/teaser/teaser-ai-reinforcement_learning.png"
  -
    scope:
      path: "_pages/categories/category_ai_reinforcementlearning.html"
    values:
      title_bg: "/assets/images/lv2_bg/bg-ai-reinforcement_learning.png"

  # AI / Deep Learning
