    <div class="topbar-main">

        <!-- sidebar btn -->
        <button type="button" class="sidebar-btn" onclick="openSidebar(this)" aria-label="카테고리 메뉴 열기" aria-controls="sidebar" aria-expanded="false">
            <span class="bar1"></span>
            <span class="bar2"></span>

        <!-- home btn -->
        <span class="material-symbols-outlined icon-home">
